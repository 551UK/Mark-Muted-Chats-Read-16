# Compile, validate and upload the package to GitHub Releases.
name: Build and release
on:
  push:
    branches: [main]
    paths: ['MutedRead.m', 'ReadPreferences.h', 'prefs/**', 'MutedRead.plist', 'control', 'build.sh', 'package.py', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify rootless package
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mark-Muted-Chats-Read-16
          path: packages/*.deb
          if-no-files-found: error
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' control)"
          gh release create "v${version}" packages/*.deb --target "$GITHUB_SHA" \
            --title "Mark Muted Chats Read 16 ${version}" \
            --notes "Adds IMChatRegistry unread-update hooks for background events; removes SpringBoard injection. Keeps working foreground mute detection. No polling. Requires userspace reboot and on-device verification."

      - name: Remove previous DEB releases after successful publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="v$(sed -n 's/^Version: //p' control)"
          while IFS= read -r tag; do
            if [[ "$tag" != "$current" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Deleting superseded DEB release: $tag"
              gh release delete "$tag" --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
