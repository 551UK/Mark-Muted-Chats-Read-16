name: Remove superseded DEB releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-old-build.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest published release and delete old DEBs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh release view --json tagName --jq '.tagName')"
          echo "Retaining newest published release: $latest"
          while IFS= read -r tag; do
            if [[ "$tag" != "$latest" && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Removing old DEB release $tag"
              gh release delete "$tag" --yes
            fi
          done < <(gh release list --limit 100 --json tagName --jq '.[].tagName')
          gh release list --limit 20
